<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeBDe — Student Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>
  <!-- The server protects this page; this request refreshes the session guard for the HTMX content. -->
  <div hx-get="/api/auth/check" hx-trigger="load"></div>

  <header class="site-header">
    <div class="container navbar">
      <a class="brand-logo" href="../index.html" aria-label="DEBDE Student Tool Exchange">
        <img src="../assets/debde-icon.png" alt="DEBDE" />
        <span>DEBDE <small>Student Tool Exchange</small></span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
      <ul class="nav-menu" id="primary-nav">
        <li><a href="catalog.html" class="nav-link">Catalog</a></li>
        <li><a href="manage-listings.html" class="nav-link active">Dashboard</a></li>
        <li><a href="wishlist.html" class="nav-link">Wishlist</a></li>
      </ul>
      <div id="nav-auth-slot" class="nav-actions" hx-get="/api/auth/nav" hx-trigger="load" hx-swap="outerHTML">
        <a href="auth.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <div class="container section-padding">
    <div class="row">
      <!-- Dynamic Student Sidebar via HTMX and JWT session -->
      <div class="col-sidebar" hx-get="/api/auth/me" hx-trigger="load" hx-swap="innerHTML">
        <div class="card loading-card">
          Checking student session...
        </div>
      </div>

      <div class="col-main">
        <div class="card">
          <div class="dashboard-heading">
            <div class="dashboard-title-row">
              <h2 class="page-title page-title-inline">My Listings</h2>
              <div class="dashboard-actions">
                <a class="btn btn-primary btn-sm" href="post-item.html">+ Add Item</a>
                <a class="btn btn-secondary btn-sm" href="post-announcement.html">+ Add Announcement</a>
              </div>
            </div>

            <!-- Filter buttons trigger HTMX requests to mock server -->
            <div class="dashboard-filters">
              <button class="btn btn-secondary btn-sm" hx-get="/api/items/manage?filter=all" hx-target="#manage-grid"
                hx-swap="innerHTML">All</button>
              <button class="btn btn-secondary btn-sm" hx-get="/api/items/manage?filter=available"
                hx-target="#manage-grid" hx-swap="innerHTML">Available</button>
              <button class="btn btn-secondary btn-sm" hx-get="/api/items/manage?filter=sold" hx-target="#manage-grid"
                hx-swap="innerHTML">Sold</button>
            </div>
          </div>

          <!-- Dynamic Listings loaded via HTMX from Mock Server -->
          <div class="row" id="manage-grid" hx-get="/api/items/manage" hx-trigger="load" hx-swap="innerHTML">
            <div class="loading-text">
              Loading listings...
            </div>
          </div>
        </div>
      </div>
    </div>

    <section class="card dashboard-announcements">
      <div class="dashboard-title-row">
        <h2 class="page-title page-title-inline">My Announcements</h2>
        <a class="btn btn-secondary btn-sm" href="post-announcement.html">+ Add Announcement</a>
      </div>
      <div class="row" id="my-announcements" hx-get="/api/announcements/manage" hx-trigger="load" hx-swap="innerHTML">
        <div class="loading-text">Loading announcements...</div>
      </div>
    </section>
  </div>

  <footer class="site-footer">
    <div class="container">
      DeBDe &copy; 2026
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>

</html>
