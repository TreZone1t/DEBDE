<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeBDe — Add Item</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>
  <!-- The server protects this page; this request refreshes the session guard for the HTMX content. -->
  <div hx-get="/api/auth/check" hx-trigger="load"></div>

  <header class="site-header">
    <div class="container navbar">
      <a class="brand-logo" href="../index.html" aria-label="DEBDE Student Tool Exchange">
        <img src="../assets/debde-icon.png" alt="DEBDE" />
        <span>DEBDE <small>Student Tool Exchange</small></span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
      <ul class="nav-menu" id="primary-nav">
        <li><a href="catalog.html" class="nav-link">Catalog</a></li>
        <li><a href="manage-listings.html" class="nav-link">Dashboard</a></li>
        <li><a href="wishlist.html" class="nav-link">Wishlist</a></li>
      </ul>
      <div id="nav-auth-slot" class="nav-actions" hx-get="/api/auth/nav" hx-trigger="load" hx-swap="outerHTML">
        <a href="auth.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <div class="container section-padding">
    <div class="card post-card">
      <h2 class="page-title">Add Item or Textbook</h2>

      <div id="form-response"></div>

      <!-- HTMX Server-driven Form Submission -->
      <form id="post-item-form" hx-post="/api/items" hx-target="#form-response" hx-swap="innerHTML">
        <div class="form-group">
          <label class="form-label">Item Title</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. Engineering Compass Kit" required>
        </div>

        <div class="form-group">
          <label class="form-label">Faculty / Department</label>
          <select name="faculty" class="form-control" required>
            <option value="">Select Faculty</option>
            <option value="Faculty of Engineering">Engineering</option>
            <option value="Faculty of Medicine">Medicine</option>
            <option value="Faculty of CS & IT">Computer Science</option>
            <option value="Faculty of Pharmacy">Pharmacy</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Price (EGP)</label>
          <input type="number" id="itemPrice" name="price" class="form-control" placeholder="150" min="0">
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="isFree" name="isFree"> Free Donation (0 EGP)
          </label>
        </div>

        <div class="form-group">
          <label class="form-label">Campus Pickup Location</label>
          <input type="text" name="pickup" class="form-control" placeholder="e.g. Gate 2 or Central Library" required>
        </div>

        <div class="form-group">
          <label class="form-label">Additional Description</label>
          <textarea name="notes" class="form-control" rows="3"
            placeholder="Condition, term used, included accessories..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="itemImage">Item Photo</label>
          <input type="file" id="itemImage" class="form-control" accept="image/png,image/jpeg,image/webp">
          <input type="hidden" name="imageData" id="imageData">
          <small class="form-help">Optional. If no photo is selected, DEBDE uses its default image.</small>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Post Listing</button>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      DeBDe &copy; 2026
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/post-item.js"></script>
</body>

</html>
