<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeBDe — Catalog</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>

  <header class="site-header">
    <div class="container navbar">
      <a class="brand-logo" href="../index.html" aria-label="DEBDE Student Tool Exchange">
        <img src="../assets/debde-icon.png" alt="DEBDE" />
        <span>DEBDE <small>Student Tool Exchange</small></span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
      <ul class="nav-menu" id="primary-nav">
        <li><a href="catalog.html" class="nav-link active">Catalog</a></li>
        <li><a href="manage-listings.html" class="nav-link">Dashboard</a></li>
        <li><a href="wishlist.html" class="nav-link">Wishlist</a></li>
      </ul>
      <div id="nav-auth-slot" class="nav-actions" hx-get="/api/auth/nav" hx-trigger="load" hx-swap="outerHTML">
        <a href="auth.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <div class="container section-padding">
    <div class="row">

      <!-- Task 1: Filter sidebar -->
      <aside class="col-sidebar">
        <div class="card">
          <form id="filter-form" hx-get="/api/catalog" hx-target="#catalog-grid" hx-swap="innerHTML">
            <input type="hidden" name="q" id="q-field" value="">

            <div class="filter-group">
              <h4>Faculty / Department</h4>
              <label><input type="checkbox" name="faculty" value="Engineering"> Engineering</label>
              <label><input type="checkbox" name="faculty" value="CS & IT"> CS &amp; IT</label>
              <label><input type="checkbox" name="faculty" value="Medicine"> Medicine</label>
              <label><input type="checkbox" name="faculty" value="Pharmacy"> Pharmacy</label>
              <label><input type="checkbox" name="faculty" value="Science"> Science</label>
              <label><input type="checkbox" name="faculty" value="Other"> Other</label>
            </div>

            <div class="filter-group">
              <h4>Price Type</h4>
              <label><input type="radio" name="price" value="all" checked> All</label>
              <label><input type="radio" name="price" value="free"> Free / Donation Only (0 EGP)</label>
              <label><input type="radio" name="price" value="paid"> Paid</label>
            </div>

            <div class="filter-group">
              <h4>Condition</h4>
              <label><input type="checkbox" name="condition" value="New"> New</label>
              <label><input type="checkbox" name="condition" value="Like New"> Like New</label>
              <label><input type="checkbox" name="condition" value="Used"> Used</label>
            </div>

            <div class="filter-group">
              <h4>Sort by</h4>
              <select name="sort" class="form-control">
                <option value="newest">Newest First</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary btn-sm btn-block">Apply Filters</button>
          </form>

        </div>
      </aside>

      <!-- Task 2: Catalog grid -->
      <main class="col-main">
        <div class="row" id="catalog-grid" hx-get="/api/catalog?all=1" hx-trigger="load" hx-swap="innerHTML">
          <div class="loading-text">Loading catalog items...</div>
        </div>
      </main>

    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      DeBDe &copy; 2026
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>

</html>
