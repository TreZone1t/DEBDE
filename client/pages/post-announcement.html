<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeBDe - Add Announcement</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
  <div hx-get="/api/auth/check" hx-trigger="load"></div>
  <header class="site-header">
    <div class="container navbar">
      <a class="brand-logo" href="../index.html" aria-label="DEBDE Student Tool Exchange"><img src="../assets/debde-icon.png" alt="DEBDE"><span>DEBDE <small>Student Tool Exchange</small></span></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
      <ul class="nav-menu" id="primary-nav">
        <li><a href="catalog.html" class="nav-link">Catalog</a></li>
        <li><a href="manage-listings.html" class="nav-link active">Dashboard</a></li>
        <li><a href="wishlist.html" class="nav-link">Wishlist</a></li>
      </ul>
      <div id="nav-auth-slot" class="nav-actions" hx-get="/api/auth/nav" hx-trigger="load" hx-swap="outerHTML"></div>
    </div>
  </header>
  <main class="container section-padding">
    <div class="card post-card">
      <h2 class="page-title">Add Announcement</h2>
      <div id="form-response"></div>
      <form id="post-announcement-form" hx-post="/api/announcements" hx-target="#form-response" hx-swap="innerHTML">
        <div class="form-group"><label class="form-label">Title</label><input name="title" class="form-control" required></div>
        <div class="form-group"><label class="form-label">Type</label><select name="type" class="form-control"><option value="club">Club</option><option value="supplier">Supplier</option><option value="student project">Student Project</option><option value="campus">Campus</option></select></div>
        <div class="form-group"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="4" required></textarea></div>
        <div class="form-group"><label class="form-label">City</label><input name="city" class="form-control" placeholder="New Borg El Arab" required></div>
        <div class="form-group"><label class="form-label">Campus</label><input name="campus" class="form-control" placeholder="Main Campus" required></div>
        <div class="form-group"><label class="form-label" for="announcementImage">Image</label><input type="file" id="announcementImage" class="form-control" accept="image/png,image/jpeg,image/webp"><input type="hidden" name="imageData" id="announcementImageData"><small class="form-help">Optional. Maximum 5 MB.</small></div>
        <button type="submit" class="btn btn-primary btn-block">Publish Announcement</button>
      </form>
    </div>
  </main>
  <footer class="site-footer"><div class="container">DeBDe &copy; 2026</div></footer>
  <script src="../js/main.js"></script>
  <script src="../js/post-announcement.js"></script>
</body>
</html>
